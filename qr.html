<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pallet & Barcode Generator na A4 PDF</title>
  
  <!-- Skripte -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
      border: 1px solid var(--border);
    }

    h1 { margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 12px; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 650px) { .controls { grid-template-columns: 1fr; } }

    .input-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 600; font-size: 0.9rem; color: #475569; }

    input[type="text"], input[type="file"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f1f5f9;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
    }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }

    #status { font-size: 0.85rem; color: #2563eb; font-weight: 600; margin-top: 4px; }

    .a4-preview-wrapper {
      margin-top: 20px;
      overflow-x: auto;
      background: #cbd5e1;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .a4Page {
      width: 210mm;
      height: 297mm;
      padding: 12mm 12mm;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .a4-header {
      border-bottom: 2px solid #0f172a;
      padding-bottom: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pallet-info { display: flex; align-items: center; gap: 12px; }
    .pallet-text { font-size: 13pt; font-weight: bold; color: #0f172a; }
    .pallet-barcode-container svg { height: 35px; max-width: 180px; }
    .page-number-tag { font-size: 9pt; color: #64748b; font-weight: 600; }

    .a4-content {
      display: flex;
      gap: 15px;
      flex: 1;
      height: calc(100% - 70px);
    }

    .left-col {
      width: 60%;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px 10px;
      max-height: 100%;
    }

    .barcode-item {
      width: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 3px;
      box-sizing: border-box;
    }

    .barcode-item svg { width: 100%; height: 26px; }
    .barcode-val { font-family: monospace; font-size: 7pt; font-weight: bold; word-break: break-all; margin-top: 1px; }

    .right-col {
      width: 40%;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-left: 1px dashed #cbd5e1;
      padding-left: 15px;
    }

    .qr-box {
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
    }

    .qr-box h3 { margin: 0 0 8px 0; font-size: 10pt; }
    .qr-container { display: flex; justify-content: center; margin-bottom: 8px; }
    .qr-desc { font-size: 7.5pt; color: #64748b; word-break: break-all; max-height: 120px; overflow: hidden; font-family: monospace; }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Pallet & Barcode Generator na A4 PDF</h1>

  <div class="controls">
    <div class="input-group">
      <label for="palletIdInput">1. Upišite PalletID:</label>
      <input type="text" id="palletIdInput" value="PAL2026709YZBV007" oninput="renderPreview()">

      <label for="fileInput" style="margin-top: 10px;">2. Upload (Slika, PDF ili Excel):</label>
      <input type="file" id="fileInput" accept="image/*, .pdf, .xlsx, .xls, .csv">
      <div id="status">Spremno za rad.</div>
    </div>

    <div class="input-group">
      <label for="resultText">3. Kodovi proizvoda (odvojeni zarezom):</label>
      <textarea id="resultText" placeholder="Unesite ili učitajte kodove..."></textarea>
      <div class="btn-group">
        <button class="btn-primary" onclick="renderPreview()">Osvježi Prikaz</button>
        <button class="btn-success" onclick="downloadPDF()">Spremi / Printaj PDF</button>
      </div>
    </div>
  </div>

  <div class="a4-preview-wrapper" id="pdfExportContainer"></div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  const fileInput = document.getElementById('fileInput');
  const statusDiv = document.getElementById('status');
  const resultText = document.getElementById('resultText');
  const palletIdInput = document.getElementById('palletIdInput');

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    statusDiv.innerText = "Čitanje datoteke u tijeku...";
    const fileName = file.name.toLowerCase();

    try {
      if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) {
        await processExcel(file);
      } else if (fileName.endsWith('.pdf')) {
        await processPDF(file);
      } else if (file.type.startsWith('image/')) {
        await processImage(file);
      }
    } catch (err) {
      console.error(err);
      statusDiv.innerText = "Greška pri obradi datoteke.";
    }
  });

  async function processExcel(file) {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type: 'array' });
    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

    let extracted = [];
    json.forEach(row => {
      row.forEach(cell => {
        if (cell !== null && cell !== undefined) {
          let str = String(cell).trim();
          if (str) extracted.push(str);
        }
      });
    });

    resultText.value = filterCodes(extracted).join(", ");
    statusDiv.innerText = "Excel uspješno pročitan!";
    renderPreview();
  }

  async function processPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      fullText += textContent.items.map(item => item.str).join(" ") + "\n";
    }

    let tokens = fullText.split(/[\s,\n]+/);
    let cleaned = filterCodes(tokens);

    resultText.value = cleaned.join(", ");
    statusDiv.innerText = "PDF uspješno pročitan!";
    renderPreview();
  }

  async function processImage(file) {
    statusDiv.innerText = "Skeniranje slike u tijeku (molimo pričekajte)...";
    
    // Inicijalizacija Tesseract skenera
    const worker = await Tesseract.createWorker('eng');
    const ret = await worker.recognize(file);
    await worker.terminate();

    // Razdvajanje po razmacima i novim redovima
    const tokens = ret.data.text.split(/[\s,\n]+/);
    const cleanedCodes = filterCodes(tokens);

    if (cleanedCodes.length === 0) {
      statusDiv.innerText = "Upozorenje: Nije pronađen niti jedan kod. Provjerite sliku ili unesite ručno.";
    } else {
      statusDiv.innerText = `Pronađeno ${cleanedCodes.length} kodova!`;
    }

    resultText.value = cleanedCodes.join(", ");
    renderPreview();
  }

  // POBOLJŠANI FILTER: Ne gubi kodove s crticama ili kraćim zapisom
  function filterCodes(tokens) {
    const valid = [];

    tokens.forEach(token => {
      // Uklanjamo točke na kraju rečenica/riječi
      let clean = token.replace(/\.+$/, "").replace(/^\.+/, "").trim();

      // Izbacujemo samo čiste kratke brojeve (npr. redne brojeve stavki 193, 204, 224 itd.)
      if (/^\d{1,3}$/.test(clean)) return;

      // Izbacujemo opće riječi naslova
      if (["S/N", "LIST", "item", "Zonneplan", "Nexus", "thuisbatterij"].includes(clean)) return;

      // Zadržavamo sve što ima bar 5 znakova i u sebi ima slova ili brojeve
      if (clean.length >= 5 && /[A-Z0-9]/i.test(clean)) {
        valid.push(clean);
      }
    });

    // Uklanjamo duplikate
    return [...new Set(valid)];
  }

  function renderPreview() {
    const raw = resultText.value.trim();
    const palletId = palletIdInput.value.trim() || "PALLET-N/A";
    const container = document.getElementById('pdfExportContainer');
    container.innerHTML = '';

    if (!raw) return;

    const items = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
    const ITEMS_PER_PAGE = 32;
    const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE) || 1;

    for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
      const pageItems = items.slice(pageIdx * ITEMS_PER_PAGE, (pageIdx + 1) * ITEMS_PER_PAGE);
      const pageRawValue = pageItems.join(", ");

      const pageDiv = document.createElement('div');
      pageDiv.className = 'a4Page';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'a4-header';
      headerDiv.innerHTML = `
        <div class="pallet-info">
          <span class="pallet-text">PalletID: [ ${palletId} ]</span>
          <div class="pallet-barcode-container">
            <svg id="pallet-bc-${pageIdx}"></svg>
          </div>
        </div>
        <div class="page-number-tag">Stranica ${pageIdx + 1} od ${totalPages}</div>
      `;
      pageDiv.appendChild(headerDiv);

      const contentDiv = document.createElement('div');
      contentDiv.className = 'a4-content';

      const leftCol = document.createElement('div');
      leftCol.className = 'left-col';

      pageItems.forEach((code, idx) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'barcode-item';

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = `item-bc-${pageIdx}-${idx}`;
        itemDiv.appendChild(svg);

        const valText = document.createElement('div');
        valText.className = 'barcode-val';
        valText.innerText = code;
        itemDiv.appendChild(valText);

        leftCol.appendChild(itemDiv);
      });

      const rightCol = document.createElement('div');
      rightCol.className = 'right-col';

      const qrBox = document.createElement('div');
      qrBox.className = 'qr-box';
      qrBox.innerHTML = `
        <h3>QR Kod Vrijednosti (bez PalletID)</h3>
        <div class="qr-container" id="qr-target-${pageIdx}"></div>
        <div class="qr-desc">${pageRawValue}</div>
      `;
      rightCol.appendChild(qrBox);

      contentDiv.appendChild(leftCol);
      contentDiv.appendChild(rightCol);
      pageDiv.appendChild(contentDiv);
      container.appendChild(pageDiv);

      try {
        JsBarcode(`#pallet-bc-${pageIdx}`, palletId, { format: "CODE128", displayValue: false, height: 35, margin: 0 });
      } catch (e) {
        JsBarcode(`#pallet-bc-${pageIdx}`, "ERR", { displayValue: false });
      }

      pageItems.forEach((code, idx) => {
        try {
          JsBarcode(`#item-bc-${pageIdx}-${idx}`, code, { format: "CODE128", displayValue: false, height: 22, margin: 0 });
        } catch (e) {
          JsBarcode(`#item-bc-${pageIdx}-${idx}`, "ERR", { displayValue: false });
        }
      });

      new QRCode(document.getElementById(`qr-target-${pageIdx}`), {
        text: pageRawValue,
        width: 170,
        height: 170,
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }

  function downloadPDF() {
    const element = document.getElementById('pdfExportContainer');
    const opt = {
      margin:       0,
      filename:     `Paleta_${palletIdInput.value.trim() || 'export'}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
  }

  window.onload = function() {
    resultText.value = "Y260523D30530469, Y260523D30530467, Y260523D30530468, Y260523D30530471, Y260523D30530473, Y260523D30530474, Y260523D30530472, Y260523D30530476, Y260523D30530477, Y260523D30530478, Y260523D30530480, Y260523D30530479, Y260523D30530475, Y260523D30530481, Y260523D30530455, Y260523D30530270, Y260523D30530271, Y260523D30530272, Y260523D30530269, Y260523D30530274, Y260523D30530277, Y260523D30530273, Y260523D30530267, Y260523D30530280, Y260523D30530278, Y260523D30530281, Y260523D30530279, Y260523D30530284, Y260523D30530282, Y260523D30530285, Y260523D30530283, Y260523D30530288";
    renderPreview();
  };
</script>

</body>
</html>
