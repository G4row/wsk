<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Štoperica & Mjerenje Vremena</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        .timer-display { font-size: 2.5rem; font-weight: 700; font-family: monospace; text-align: center; margin: 15px 0; color: #0284c7; background: #f1f5f9; padding: 15px; border-radius: 12px; border: 2px solid #cbd5e1; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1 data-i18n="sw_header">Stranica 4: Štoperica</h1>
            <p data-i18n="sw_sub">Mjerenje radnih operacija i Excel izvoz</p>
        </div>
        <div class="lang-switcher">
            <button class="lang-btn" onclick="setLanguage('en')" title="English">🇬🇧</button>
            <button class="lang-btn" onclick="setLanguage('nl')" title="Nederlands">🇳🇱</button>
            <button class="lang-btn" onclick="setLanguage('hr')" title="Hrvatski">🇭🇷</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="timer-display" id="display">00:00:00.0</div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnStart" onclick="startTimer()" data-i18n="btn_start">Početak</button>
                <button class="btn btn-secondary" id="btnPause" onclick="pauseTimer()" disabled data-i18n="btn_pause">Pauza</button>
                <button class="btn btn-secondary" id="btnCheckpoint" onclick="addCheckpoint()" disabled data-i18n="btn_lap">Checkpoint</button>
                <button class="btn btn-danger" id="btnStop" onclick="stopTimer()" disabled data-i18n="btn_stop">Kraj</button>
            </div>
        </div>

        <div class="card" id="resultsCard" style="display:none;">
            <h2 data-i18n="recorded_laps">Zabilježena Vremena</h2>
            <table id="checkpointTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th data-i18n="col_split">Checkpoint Vrijeme</th>
                        <th data-i18n="col_total">Ukupno Vrijeme</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="btn-group" style="margin-top:15px;">
                <button class="btn btn-primary" onclick="downloadExcel()" data-i18n="btn_export">Preuzmi Excel Tablicu</button>
                <button class="btn btn-danger" onclick="resetAll()" data-i18n="btn_reset">Resetiraj</button>
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span data-i18n="nav_menu">Izbornik</span>
        </a>
        <a href="mod.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/></svg>
            MOD
        </a>
        <a href="picking.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Picking
        </a>
        <a href="abc.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.5 5h3v14h-3zM16 13h3v6h-3z"/></svg>
            ABC
        </a>
        <a href="stopwatch.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-2 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            <span data-i18n="nav_timer">Štoperica</span>
        </a>
        <a href="inventory.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zm-1 5H5v-4h14v4zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zm-1 5H5V5h14v3z"/></svg>
            Inventory
        </a>
    </nav>

    <script>
        const i18nData = {
            en: {
                sw_header: "Page 4: Operations Stopwatch", sw_sub: "Time tasks, track laps, export to Excel",
                btn_start: "Start", btn_pause: "Pause", btn_lap: "Lap", btn_stop: "Stop", recorded_laps: "Recorded Times", col_split: "Lap Time", col_total: "Total Time", btn_export: "Export Excel", btn_reset: "Reset", nav_menu: "Menu", nav_timer: "Timer"
            },
            nl: {
                sw_header: "Pagina 4: Operationele Stopwatch", sw_sub: "Meet tijden, leg rondes vast en exporteer",
                btn_start: "Start", btn_pause: "Pauze", btn_lap: "Ronde", btn_stop: "Stop", recorded_laps: "Geregistreerde Tijden", col_split: "Rondetijd", col_total: "Totale Tijd", btn_export: "Exporteer Excel", btn_reset: "Reset", nav_menu: "Menu", nav_timer: "Timer"
            },
            hr: {
                sw_header: "Stranica 4: Štoperica", sw_sub: "Mjerenje radnih operacija i Excel izvoz",
                btn_start: "Početak", btn_pause: "Pauza", btn_lap: "Checkpoint", btn_stop: "Kraj", recorded_laps: "Zabilježena Vremena", col_split: "Checkpoint Vrijeme", col_total: "Ukupno Vrijeme", btn_export: "Preuzmi Excel", btn_reset: "Resetiraj", nav_menu: "Izbornik", nav_timer: "Štoperica"
            }
        };

        let currentLang = sessionStorage.getItem('appLang') || 'en';
        let timerInterval = null, startTime = null, elapsedTime = 0, isRunning = false, checkpoints = [], lastCheckpointElapsed = 0;

        function setLanguage(lang) {
            currentLang = lang;
            sessionStorage.setItem('appLang', lang);
            const btns = document.querySelectorAll('.lang-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(lang === 'en') btns[0]?.classList.add('active');
            if(lang === 'nl') btns[1]?.classList.add('active');
            if(lang === 'hr') btns[2]?.classList.add('active');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18nData[lang] && i18nData[lang][key]) el.innerText = i18nData[lang][key];
            });
        }

        function formatTime(ms) {
            const d = new Date(ms);
            return `${String(Math.floor(ms / 3600000)).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}.${Math.floor(d.getMilliseconds() / 100)}`;
        }

        function updateDisplay() {
            document.getElementById('display').innerText = formatTime(elapsedTime + (isRunning ? (Date.now() - startTime) : 0));
        }

        function startTimer() {
            if (!isRunning) {
                startTime = Date.now(); timerInterval = setInterval(updateDisplay, 50); isRunning = true;
                document.getElementById('btnStart').disabled = true; document.getElementById('btnPause').disabled = false;
                document.getElementById('btnCheckpoint').disabled = false; document.getElementById('btnStop').disabled = false;
            }
        }

        function pauseTimer() {
            if (isRunning) {
                clearInterval(timerInterval); elapsedTime += Date.now() - startTime; isRunning = false;
                document.getElementById('btnStart').disabled = false; document.getElementById('btnPause').disabled = true;
            }
        }

        function addCheckpoint() {
            const currentTotal = elapsedTime + (isRunning ? (Date.now() - startTime) : 0);
            checkpoints.push({ split: formatTime(currentTotal - lastCheckpointElapsed), total: formatTime(currentTotal) });
            lastCheckpointElapsed = currentTotal; renderCheckpoints();
        }

        function stopTimer() {
            pauseTimer(); addCheckpoint();
            document.getElementById('btnStart').disabled = true; document.getElementById('btnCheckpoint').disabled = true; document.getElementById('btnStop').disabled = true;
        }

        function renderCheckpoints() {
            document.getElementById('resultsCard').style.display = 'block';
            const tbody = document.querySelector('#checkpointTable tbody'); tbody.innerHTML = '';
            checkpoints.forEach((cp, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${idx + 1}</td><td><strong>${cp.split}</strong></td><td><strong style="color:var(--primary);">${cp.total}</strong></td>`;
                tbody.appendChild(tr);
            });
        }

        function downloadExcel() {
            if (checkpoints.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(checkpoints.map(cp => ({ "Lap Time": cp.split, "Total Time": cp.total })));
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Timer Results");
            XLSX.writeFile(wb, "stoperica.xlsx");
        }

        function resetAll() {
            clearInterval(timerInterval); startTime = null; elapsedTime = 0; isRunning = false; checkpoints = []; lastCheckpointElapsed = 0;
            document.getElementById('display').innerText = "00:00:00.0"; document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('btnStart').disabled = false; document.getElementById('btnPause').disabled = true;
            document.getElementById('btnCheckpoint').disabled = true; document.getElementById('btnStop').disabled = true;
        }

        document.addEventListener('DOMContentLoaded', () => setLanguage(currentLang));
    </script>
</body>
</html>
